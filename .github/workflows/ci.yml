name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Verify pnpm version
        run: corepack pnpm --version

      - name: Install reproducibly
        run: corepack pnpm install --frozen-lockfile

      - name: Verify React runtime alignment
        run: corepack pnpm run check:react-runtime
      - name: Verify architecture boundaries
        run: corepack pnpm run check:architecture

      - name: TypeScript
        run: corepack pnpm run typecheck

      - name: Production build
        run: corepack pnpm run build

      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install chromium --with-deps

      - name: Runtime smoke test
        run: corepack pnpm run test:smoke

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-runtime-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level high

      - name: Audit all dependencies
        run: corepack pnpm audit --audit-level high
